<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riconosci le note</title>
<style>
 body{display:flex; justify-content:center; font-family:sans-serif; background:#fffef7; padding:10px; margin:0;}
 #app{max-width:820px; margin:auto; border:2px solid #222; border-radius:16px; padding:20px; background:white; width:100%; box-sizing:border-box;}
 #staff { width:100%; overflow:hidden; }
 #staff svg { width:100%!important; height:auto!important; }
 #inputs{display:grid; grid-template-columns:repeat(15,1fr); gap:6px; margin:10px 0; box-sizing:border-box;}
 select{padding:6px 2px; border-radius:6px; text-align:center; font-weight:bold; width:100%;}
 button{padding:12px; font-size:16px; border-radius:10px; border:none; font-weight:bold; cursor:pointer;}
 @media (max-width:600px){
   #app{ padding:12px; }
   #inputs{ grid-template-columns:repeat(5,1fr); }
   #staff{ overflow-x:auto; }
 }
 #app:fullscreen{ max-width:100%; width:100%; height:100%; border:none; border-radius:0; overflow:auto; }
 #app.pseudo-fs{ position:fixed; inset:0; z-index:9999; max-width:100%; width:100%; height:100%; border:none; border-radius:0; overflow:auto; }
</style>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
</head>
<body>
<div id="app">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
    <h3 style="margin:0;">🎼 Riconosci le note</h3>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <button id="fsBtn" onclick="toggleFS()" style="padding:8px 12px; background:#fff; border:2px solid #222; font-size:16px; flex:none;">⛶ Schermo intero</button>
      <select id="timeSelector" style="padding:6px; border-radius:8px; font-weight:bold; width:auto;">
        <option value="240">4 minuti</option>
        <option value="120" selected>2 minuti</option>
        <option value="60">60 secondi</option>
      </select>
      <div id="timer" style="font-size:22px; font-weight:bold; background:#222; color:#fff; padding:6px 14px; border-radius:8px;">120s</div>
    </div>
  </div>
  <input type="text" id="nomeStudente" placeholder="Inserisci Nome e Cognome" style="padding:8px; border-radius:6px; border:1px solid #ccc; width:100%; margin:10px 0; box-sizing:border-box;">
  <div id="staff"></div>
  <div id="inputs"></div>
  <div style="display:flex; gap:10px; margin-top:10px;">
    <button id="startBtn" style="flex:1; background:#ffcc00;" onclick="start()">▶️ Inizia</button>
    <button style="flex:1; background:#111; color:white;" onclick="check()">Verifica</button>
  </div>
  <div id="result" style="margin-top:15px; font-size:18px; font-weight:bold;"></div>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbybfasGs-23V25Cbq63S-O8i_ZH8Nr5z4tbBZWJNNRpdwRn3X18OUXG9lpxXC2y3Vgo/exec";
const { Renderer, Stave, StaveNote, Voice, Formatter } = Vex.Flow;
let NOTES=[], PITCHES=[{key:"c/4",name:"DO"},{key:"d/4",name:"RE"},{key:"e/4",name:"MI"},{key:"f/4",name:"FA"},{key:"g/4",name:"SOL"},{key:"a/4",name:"LA"},{key:"b/4",name:"SI"},{key:"c/5",name:"DO"},{key:"d/5",name:"RE"},{key:"e/5",name:"MI"},{key:"f/5",name:"FA"},{key:"g/5",name:"SOL"}];
let timerInt, timeLeft=120;
let inizioEsercizio = Date.now();
function generateNotes(){NOTES=[]; for(let i=0;i<15;i++) NOTES.push(PITCHES[Math.floor(Math.random()*PITCHES.length)]);}
function drawStaff(){
  const div=document.getElementById("staff"); div.innerHTML="";
  const renderer=new Renderer(div, Renderer.Backends.SVG); renderer.resize(780,180);
  const ctx=renderer.getContext();
  const stave=new Stave(10,20,760);
  stave.addClef("treble").setContext(ctx).draw();
  const vexNotes=NOTES.map(n=>new StaveNote({clef:"treble", keys:[n.key], duration:"q"}));
  const voice=new Voice({num_beats:15, beat_value:4}).addTickables(vexNotes);
  new Formatter().joinVoices([voice]).formatToStave([voice],stave);
  voice.draw(ctx,stave);
  setTimeout(()=>{
    const inputsDiv = document.getElementById("inputs");
    inputsDiv.innerHTML = "";
    if(window.innerWidth > 600){ inputsDiv.style.marginLeft = "50px"; inputsDiv.style.width = "calc(100% - 60px)"; } else { inputsDiv.style.marginLeft = "0px"; inputsDiv.style.width = "100%"; }
    vexNotes.forEach((_,i)=>{
      const sel = document.createElement("select");
      sel.id = "n"+i;
      sel.innerHTML = `<option value="">?</option><option>DO</option><option>RE</option><option>MI</option><option>FA</option><option>SOL</option><option>LA</option><option>SI</option>`;
      inputsDiv.appendChild(sel);
    });
  }, 50);
}
function start(){
  inizioEsercizio = Date.now();
  generateNotes(); drawStaff();
  document.getElementById("result").innerHTML="";
  timeLeft = parseInt(document.getElementById("timeSelector").value);
  document.getElementById("timer").textContent=timeLeft+"s";
  clearInterval(timerInt);
  timerInt=setInterval(()=>{ timeLeft--; document.getElementById("timer").textContent=timeLeft+"s"; if(timeLeft<=0){clearInterval(timerInt); check(true);} },1000);
}
function check(fineTempo=false){
  let nomeUtente = document.getElementById('nomeStudente').value.trim();
  if(!nomeUtente){ alert('Scrivi prima il tuo nome!'); return; }
  let ok=0;
  NOTES.forEach((n,i)=>{ const s=document.getElementById("n"+i); if(s && s.value===n.name){ok++; s.style.background="#b6f7b6";} else if(s){s.style.background="#ffb3b3";} });
  let errori = 15 - ok;
  let tempoImpiegato = Math.round((Date.now() - inizioEsercizio) / 1000);
  document.getElementById("result").innerHTML=`Hai fatto ${ok} / 15! ${fineTempo?'⏰ Tempo scaduto!':''}`;
  fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({nome: nomeUtente, punteggio: ok, errori: errori, tempoSec: tempoImpiegato})
  }).catch(()=>{});
  clearInterval(timerInt);
}
function toggleFS(){
  const app = document.getElementById('app');
  const btn = document.getElementById('fsBtn');
  if(document.fullscreenElement || app.classList.contains('pseudo-fs')){
    if(document.fullscreenElement) document.exitFullscreen();
    app.classList.remove('pseudo-fs');
    btn.textContent = '⛶ Schermo intero';
    setTimeout(drawStaff, 100);
    return;
  }
  if(app.requestFullscreen){
    app.requestFullscreen().then(()=>{ btn.textContent = '✕ Esci'; setTimeout(drawStaff, 100); }).catch(()=>{ app.classList.add('pseudo-fs'); btn.textContent = '✕ Esci'; setTimeout(drawStaff, 100); });
  } else { app.classList.add('pseudo-fs'); btn.textContent = '✕ Esci'; setTimeout(drawStaff, 100); }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement){
    const app = document.getElementById('app');
    app.classList.remove('pseudo-fs');
    document.getElementById('fsBtn').textContent = '⛶ Schermo intero';
    setTimeout(drawStaff, 100);
  }
});
generateNotes(); drawStaff();
</script>
</body>
</html>
